
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Tithi 💚</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #010805;
  color: white;
  min-height: 100vh;
  overflow: hidden;
  font-family: Georgia, serif;
}

.scene {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  position: relative;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(ellipse at 50% 38%,
      #063b17 0%, #021609 35%, #010503 75%);
}

/* Background glowing particles */
#particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.particle {
  position: absolute;
  border-radius: 50%;
  background: #66ff80;
  box-shadow: 0 0 8px #00ff55, 0 0 20px #00ff55;
  animation: twinkle 1.5s ease-in-out infinite alternate;
}

@keyframes twinkle {
  from { opacity: .15; transform: scale(.6); }
  to { opacity: 1; transform: scale(1.5); }
}

/* Floating hearts */
.float-heart {
  position: absolute;
  color: #26ff63;
  text-shadow: 0 0 12px #00ff44, 0 0 30px #00ff44;
  animation: float 5s ease-in-out infinite;
  opacity: .7;
  pointer-events: none;
}

@keyframes float {
  0%, 100% { transform: translateY(0) rotate(-10deg); }
  50% { transform: translateY(-25px) rotate(10deg); }
}

/* Main heart */
.heart-wrap {
  position: absolute;
  top: 12%;
  left: 50%;
  width: min(72vw, 350px);
  aspect-ratio: 1;
  transform: translateX(-50%) scale(.05);
  opacity: 0;
  transition: transform 1.1s cubic-bezier(.2,1.7,.4,1),
              opacity .6s;
  filter: drop-shadow(0 0 16px #00ff55);
  z-index: 3;
}

.heart-wrap.show {
  transform: translateX(-50%) scale(1);
  opacity: 1;
}

.heart {
  position: relative;
  width: 100%;
  height: 100%;
  animation: heartbeat 2s ease-in-out infinite;
}

.heart::before,
.heart::after {
  content: "";
  position: absolute;
  top: 10%;
  width: 50%;
  height: 78%;
  border-radius: 50% 50% 0 0;
  background: linear-gradient(90deg,
    #064719, #12b83d 35%, #004c19 72%, #37ff68);
  border: 2px solid #6dff8b;
}

.heart::before {
  left: 50%;
  transform: rotate(-45deg);
  transform-origin: 0 100%;
  border-radius: 50% 50% 0 0;
}

.heart::after {
  left: 0;
  transform: rotate(45deg);
  transform-origin: 100% 100%;
  border-radius: 50% 50% 0 0;
  background: linear-gradient(90deg,
    #37ff68, #00691d 45%, #0ab938);
}

.heart-inner {
  position: absolute;
  inset: 20% 8% 10%;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  opacity: 0;
  transform: scale(.5);
  transition: opacity 1s .4s, transform 1s .4s;
}

.heart-wrap.show .heart-inner {
  opacity: 1;
  transform: scale(1);
}

.heart-inner h1 {
  font-size: clamp(23px, 6vw, 40px);
  line-height: 1.25;
  color: #fff8be;
  text-shadow: 0 0 7px #fff, 0 0 20px #ffea57;
}

.heart-inner .name {
  font-size: clamp(30px, 8vw, 53px);
  font-weight: bold;
  color: #a8ffb7;
  text-shadow: 0 0 10px #00ff48, 0 0 28px #00ff48;
  margin-top: 5px;
}

.crown {
  font-size: 28px;
  margin-bottom: 3px;
  filter: drop-shadow(0 0 8px gold);
}

.heart-wrap.glow {
  animation: heartGlow 1s ease-in-out 3;
}

@keyframes heartbeat {
  0%, 100% { scale: 1; }
  50% { scale: 1.035; }
}

@keyframes heartGlow {
  0%, 100% { filter: drop-shadow(0 0 16px #00ff55); }
  50% { filter: drop-shadow(0 0 55px #a5ff00); }
}

/* Arrow */
.arrow {
  position: absolute;
  z-index: 5;
  left: calc(50% - 3px);
  bottom: -100px;
  width: 6px;
  height: 125px;
  border-radius: 10px;
  background: linear-gradient(to top, #9b6500, #fff6a0, #00ff68);
  box-shadow: 0 0 12px #00ff68, 0 0 30px #00ff68;
  opacity: 0;
}

.arrow::before {
  content: "";
  position: absolute;
  top: -17px;
  left: -10px;
  width: 0;
  height: 0;
  border-left: 13px solid transparent;
  border-right: 13px solid transparent;
  border-bottom: 25px solid #c7ffb8;
  filter: drop-shadow(0 0 8px #00ff55);
}

.arrow::after {
  content: "➤";
  position: absolute;
  bottom: 0;
  left: -10px;
  font-size: 24px;
  color: #7dff92;
  transform: rotate(-90deg);
}

.arrow.shoot {
  animation: shoot 1.3s cubic-bezier(.3,.7,.3,1) forwards;
}

@keyframes shoot {
  0% {
    bottom: -100px;
    opacity: 1;
    transform: scale(1);
  }
  85% { opacity: 1; }
  100% {
    bottom: 67%;
    opacity: 0;
    transform: scale(.7);
  }
}

/* Bow at bottom */
.bow {
  position: absolute;
  bottom: 6%;
  left: 50%;
  transform: translateX(-50%);
  font-size: clamp(70px, 17vw, 120px);
  color: #d4a642;
  text-shadow: 0 0 15px #00ff55;
  z-index: 2;
}

/* Fireworks and sparkle */
.spark {
  position: absolute;
  z-index: 8;
  pointer-events: none;
  color: #c5ff69;
  text-shadow: 0 0 10px #00ff55, 0 0 25px #ffff80;
  animation: sparkle 1.4s ease-out forwards;
}

@keyframes sparkle {
  0% {
    opacity: 0;
    transform: scale(.1) rotate(0);
  }
  35% { opacity: 1; }
  100% {
    opacity: 0;
    transform: scale(1.8) rotate(180deg);
  }
}

.message {
  position: absolute;
  bottom: 2%;
  text-align: center;
  color: #9bffb0;
  font: 12px Arial, sans-serif;
  letter-spacing: 3px;
  opacity: .8;
  z-index: 4;
}

.start-btn {
  position: absolute;
  z-index: 10;
  bottom: 14%;
  padding: 13px 24px;
  border: 1px solid #8cff9d;
  border-radius: 30px;
  color: #d9ffe0;
  background: #06451d;
  box-shadow: 0 0 20px #00ff5570;
  font-size: 15px;
  cursor: pointer;
  transition: .3s;
}

.start-btn:hover {
  background: #08772c;
  box-shadow: 0 0 35px #00ff55;
}

.start-btn.hide {
  display: none;
}

@media (max-height: 600px) {
  .heart-wrap { width: min(48vh, 270px); top: 5%; }
  .bow { bottom: 1%; font-size: 65px; }
  .start-btn { bottom: 10%; }
  .message { display: none; }
}

.credit {
  position: absolute;
  bottom: 12px;
  right: 14px;
  font-family: Arial, sans-serif;
  font-size: 10px;
  letter-spacing: 1px;
  color: #8aff9f;
  opacity: 0.75;
  text-shadow: 0 0 8px #00ff55;
  z-index: 20;
}

</style>
</head>

<body>
<div class="scene" id="scene">

  <div id="particles"></div>

  <div class="float-heart" style="left:8%;top:22%;font-size:30px">♥</div>
  <div class="float-heart" style="right:10%;top:30%;font-size:24px;animation-delay:1s">♥</div>
  <div class="float-heart" style="left:15%;top:65%;font-size:20px;animation-delay:2s">♥</div>
  <div class="float-heart" style="right:14%;top:68%;font-size:34px;animation-delay:.5s">♥</div>

  <div class="heart-wrap" id="heart">
    <div class="heart">
      <div class="heart-inner">
        <div class="crown">♛</div>
        <h1>Happy<br>Birthday</h1>
        <div class="name">Tithi</div>
        <div style="color:#fff3a0;margin-top:8px;font-size:20px">♥ ━ ♥</div>
      </div>
    </div>
  </div>

  <div class="arrow" id="arrow"></div>
  <div class="bow">⌒♡⌒</div>

  <button class="start-btn" id="startBtn" onclick="startShow()">
    🏹 Shoot the Arrow
  </button>

  <div class="message">A MAGICAL WISH FOR TITHI 💚</div>
</div>

<div class="credit">Script by Sajid</div>


<script>
const scene = document.getElementById("scene");
const heart = document.getElementById("heart");
const arrow = document.getElementById("arrow");
const particles = document.getElementById("particles");
const startBtn = document.getElementById("startBtn");

let started = false;

// Create background stars
for (let i = 0; i < 100; i++) {
  const p = document.createElement("div");
  p.className = "particle";
  const size = 1 + Math.random() * 3;
  p.style.width = size + "px";
  p.style.height = size + "px";
  p.style.left = Math.random() * 100 + "%";
  p.style.top = Math.random() * 100 + "%";
  p.style.animationDelay = Math.random() * 3 + "s";
  p.style.animationDuration = (1 + Math.random() * 3) + "s";
  particles.appendChild(p);
}

// Sparkle burst
function sparkleBurst(count = 65) {
  const symbols = ["✦", "✧", "✨", "♥", "✺", "⋆"];

  for (let i = 0; i < count; i++) {
    const s = document.createElement("div");
    s.className = "spark";
    s.textContent = symbols[Math.floor(Math.random() * symbols.length)];

    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";
    s.style.fontSize = (10 + Math.random() * 24) + "px";
    s.style.animationDelay = Math.random() * .8 + "s";

    scene.appendChild(s);
    setTimeout(() => s.remove(), 2500);
  }
}

function startShow() {
  if (started) {
    // Replay the birthday animation
    started = false;
    heart.classList.remove("show", "glow");
    arrow.classList.remove("shoot");
    startBtn.classList.remove("hide");
    setTimeout(startShow, 100);
    return;
  }

  started = true;
  startBtn.classList.add("hide");

  // Arrow launches from the bottom
  arrow.classList.remove("shoot");
  void arrow.offsetWidth;
  arrow.classList.add("shoot");

  // Heart appears when the arrow reaches it
  setTimeout(() => {
    heart.classList.add("show", "glow");
    sparkleBurst(100);
  }, 1150);

  // More sparkling after the message appears
  setTimeout(() => sparkleBurst(65), 2200);

  // Allow replay
  setTimeout(() => {
    startBtn.textContent = "💚 Replay Birthday Wish";
    startBtn.classList.remove("hide");
  }, 4000);
}

// Automatic start after a short delay
window.addEventListener("load", () => {
  setTimeout(startShow, 700);
});
</script>
</body>
</html>
